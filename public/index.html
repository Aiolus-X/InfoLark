<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InfoLark</title><style>body{background:#f6f5ef;color:#263b31;font:15px/1.75 system-ui;margin:0}main{max-width:1000px;margin:40px auto;padding:24px}h1{font:42px Georgia,serif}section{background:#fffefa;border:1px solid #dce2d6;border-radius:12px;padding:22px;margin:18px 0}button{background:#315b44;color:white;border:0;border-radius:6px;padding:10px 16px;margin-right:8px;cursor:pointer}button:disabled{opacity:.5}a{color:#315b44}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.hint{color:#6d7b70}li{margin:8px 0}#message{white-space:pre-wrap}</style></head><body><main><h1>InfoLark</h1><p>前一天的创业与融资信息，每天 11 点送到飞书。</p><section><h2>当前状态</h2><p id="summary">正在读取…</p><p id="schedule"></p><p id="message"></p><button data-action="collect">采集资讯</button><button data-action="preview">生成本地预览</button><button data-action="deliver">发布并提醒</button><p class="hint">第一层按可复现性，第二层按价值性，第三层按影响力；每层最多 5 条，其余合格线索保留链接索引。</p></section><section><h2>日报</h2><ul id="runs"></ul></section><section><h2>采集覆盖</h2><p>记录实际获取结果，包括访问限制、未配置的渠道和日期覆盖，不把固定站点清单等同于全网。</p><pre id="sources"></pre></section></main><script>let control='';async function refresh(){try{const r=await fetch('/api/status');const s=await r.json();control=s.control;document.querySelector('#summary').textContent=`飞书应用：${s.appConfigured?'已配置':'待创建与配置'}；订阅：${s.subscribed?'已开启':'未开启'}；任务：${s.busy?'处理中':'空闲'}；候选库 ${s.articles} 条`;document.querySelector('#schedule').textContent=`${s.schedule.timezone} · ${s.schedule.prepare} 准备 · ${s.schedule.delivery} 发送 · 目标资讯日 ${s.targetDay}`;const list=document.querySelector('#runs');list.replaceChildren();for(const run of s.runs.slice().reverse()){const li=document.createElement('li');const a=document.createElement('a');a.textContent=run.day+' · '+run.status;a.href=run.document?.url||'/reports/'+run.day+'.md';a.target='_blank';a.rel='noreferrer';li.append(a);if(run.error){const p=document.createElement('p');p.textContent=run.error;li.append(p);}list.append(li);}document.querySelector('#sources').textContent=s.sources.map(x=>`${x.status==='ok'?'✓':'!'} ${x.name} · 返回 ${x.found||0} 条${x.inWindow!=null?'，目标日 '+x.inWindow+' 条':''}${x.error?' · '+x.error:''}`).join('\n');}catch{document.querySelector('#summary').textContent='无法连接 InfoLark 服务';}}for(const button of document.querySelectorAll('button[data-action]'))button.addEventListener('click',async()=>{button.disabled=true;try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json','X-InfoLark-Control':control},body:JSON.stringify({action:button.dataset.action})});const p=await r.json();document.querySelector('#message').textContent=p.message||p.error;await refresh();}catch(e){document.querySelector('#message').textContent=e.message;}finally{button.disabled=false;}});refresh();setInterval(refresh,5000);</script></body></html>
